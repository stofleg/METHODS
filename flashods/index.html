<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLASHODS">
<title>FLASHODS</title>
<link rel="manifest" href="./manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
:root{
  --bg:#0d1a0f; --surface:#0f2212; --surface2:#163019; --stroke:#1e4025;
  --gold:#f0c040; --green:#3a9e74; --red:#d94f5e; --warn:#d98a20;
  --tile:#e5dcc8; --tiletext:#1c1f2e; --txt:#d4d6f0; --muted:#6a8080; --accent:#2d7a58;
}
html,body{height:100%;height:100dvh;touch-action:manipulation;}
body{background:radial-gradient(ellipse at 50% 25%,#1a3a20 0%,var(--bg) 65%);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;
  overflow:hidden;padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
  background:linear-gradient(180deg,#2c1f0e,#1e1508);border-bottom:2px solid #8b6914;}
#logo{display:flex;flex-direction:column;line-height:1;}
.logo-title{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--gold);}
.logo-title span{color:var(--muted);font-weight:400;}
#version-badge{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
.hdr-btn{background:var(--surface2);color:var(--txt);border:1px solid var(--stroke);border-radius:8px;
  padding:6px 11px;font-size:14px;cursor:pointer;white-space:nowrap;}
.hdr-btn:active{opacity:.7;}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}
.hidden{display:none!important;}

/* Vue jeu : contenu défilant + barre de boutons fixe en bas */
#view-game{display:flex;flex-direction:column;overflow:hidden;padding:0;}
.g-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}
.g-foot{flex-shrink:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 10px);
  border-top:1px solid var(--stroke);background:var(--surface);}
.g-foot .actions,.g-foot .rv-actions{max-width:560px;margin:0 auto;}

/* Home */
.seg{display:flex;gap:8px;margin:2px 0 16px;}
.seg button{flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--stroke);
  border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer;}
.seg button.active{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.grp-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--stroke);border-radius:12px;
  padding:14px 16px;margin-bottom:8px;cursor:pointer;color:var(--txt);text-align:left;}
.grp-btn:active{opacity:.8;}
.grp-btn .g-name{font-size:15px;font-weight:700;}
.grp-btn .g-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.grp-btn .g-prog{font-size:11px;color:var(--green);margin-top:4px;font-weight:700;}
.grp-btn .g-count{font-size:20px;font-weight:800;color:var(--gold);flex-shrink:0;}
.grp-btn:disabled{opacity:.4;}
.home-sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  margin:16px 0 8px;border-top:1px solid var(--stroke);padding-top:12px;}
.sync-line{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:20px;padding-top:12px;border-top:1px solid var(--stroke);}
.sync-st{font-size:11px;color:var(--muted);}
.sync-code{font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--stroke);
  border-radius:6px;padding:4px 9px;cursor:pointer;}
.sync-code:active{opacity:.7;}

/* Card */
.card-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.prog{font-size:12px;color:var(--muted);text-align:center;}
.tirage{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 0;}
.tirage.clickable{cursor:pointer;}
.tirage-hint{font-size:11px;color:var(--muted);text-align:center;margin:-2px 0 6px;}
.tile{width:clamp(34px,10vw,46px);height:clamp(40px,12vw,54px);border-radius:8px;background:var(--tile);
  color:var(--tiletext);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,26px);
  font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.3);}
.hint{text-align:center;font-size:14px;color:var(--muted);}
.actions{display:flex;gap:10px;margin:0;}
.actions button{flex:1;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;}
.btn-found{background:var(--green);color:#fff;}
.btn-give{background:transparent;color:#e07060;border:1px solid #6a3028!important;}
.actions button:active{opacity:.8;}

/* Reveal */
.sol{background:var(--surface);border:1px solid var(--stroke);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.sol.form{opacity:.72;}
.sol-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.sol-word{font-size:17px;font-weight:800;color:var(--green);letter-spacing:.5px;cursor:pointer;}
.sol.form .sol-word{color:var(--muted);font-weight:700;}
.sol-tag{font-size:10px;color:var(--muted);border:1px solid var(--stroke);border-radius:5px;padding:1px 5px;}
.sol-def{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px;}
.sol-def.def-loading{opacity:.55;font-style:italic;}
.sol-btns{display:flex;gap:5px;flex-wrap:nowrap;margin-top:8px;}
.mini{font-size:11px;background:var(--surface2);color:var(--txt);border:1px solid var(--stroke);
  border-radius:7px;padding:5px 6px;cursor:pointer;text-decoration:none;white-space:nowrap;
  flex:1 1 auto;min-width:0;text-align:center;}
.mini:active{opacity:.7;}
.mini.dou{color:var(--warn);}
.mini.dou.on{background:var(--warn);color:var(--bg);border-color:var(--warn);}
.mini.dku{color:var(--red);}
.mini.dku.on{background:var(--red);color:#fff;border-color:var(--red);}
.rv-actions{display:flex;gap:10px;margin:0;}
.rv-actions button{flex:1;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;border:1px solid var(--stroke);}
.btn-next{background:var(--gold);color:var(--bg);border:none!important;}
.btn-markrate{background:transparent;color:#e07060;border-color:#6a3028!important;}
#view-home p{color:var(--muted);padding:16px 4px;font-size:13px;line-height:1.5;}
.end{text-align:center;padding:24px 12px;}
.end h2{color:var(--gold);font-size:20px;margin-bottom:14px;}
.start-btn{background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:14px 24px;
  font-size:16px;font-weight:800;cursor:pointer;margin:6px;}
.start-btn.sec{background:transparent;color:var(--txt);border:1px solid var(--stroke);}

/* Recherche dictionnaire (plein écran + clavier) */
#search-ov{display:none;position:fixed;inset:0;z-index:400;background:var(--bg);flex-direction:column;}
#search-ov.open{display:flex;}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--stroke);}
.s-title{color:var(--gold);font-weight:800;font-size:16px;}
.s-disp{min-height:38px;font-size:24px;font-weight:900;letter-spacing:5px;color:var(--txt);
  text-align:center;padding:12px;}
.s-disp::after{content:'|';color:var(--gold);margin-left:2px;animation:blink 1s step-start infinite;}
.s-disp:empty::before{content:'Tape un mot…';color:var(--muted);font-weight:400;
  font-size:15px;letter-spacing:0;}
@keyframes blink{50%{opacity:0;}}
.s-res{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 8px;}
.search-msg{font-size:13px;font-weight:800;margin:6px 0 8px;}
.search-msg.ok{color:var(--green);}
.search-msg.no{color:var(--red);}
.s-kb{flex-shrink:0;background:var(--surface);border-top:1px solid var(--stroke);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column;gap:5px;}
.s-row{display:flex;gap:4px;justify-content:center;}
.skk{flex:1;max-width:40px;height:48px;background:var(--surface2);color:var(--txt);
  border:1px solid var(--stroke);border-radius:8px;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.skk:active{opacity:.6;}
.skk.wide{max-width:58px;font-size:14px;}
.skk.clr{background:#6a2838;}
.skk.del{background:var(--surface2);}
/* Rallonges / cousins */
.sol-extra{margin-top:8px;font-size:12px;line-height:1.8;}
.sol-extra-t{color:var(--muted);font-weight:700;}
.chip{display:inline-block;color:var(--gold);text-decoration:none;background:var(--surface2);
  border:1px solid var(--stroke);border-radius:6px;padding:2px 7px;margin:0 4px 3px 0;}
.chip.form{font-style:italic;color:var(--muted);}

/* Liste douteux + modale fiche */
.dou-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface);border:1px solid var(--stroke);border-radius:10px;
  padding:12px 14px;margin-bottom:6px;}
.dou-word{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.5px;cursor:pointer;flex:1;}
.dou-rm{background:transparent;color:var(--muted);border:1px solid var(--stroke);border-radius:6px;
  padding:6px 10px;font-size:13px;cursor:pointer;flex-shrink:0;}
#card-modal{display:none;position:fixed;inset:0;z-index:480;align-items:flex-end;justify-content:center;}
#card-modal.open{display:flex;}
#card-bd{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
#card-panel{position:relative;z-index:1;background:var(--surface);border:1px solid var(--stroke);
  border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:640px;max-height:82svh;overflow-y:auto;}

/* Def modal (réutilise blackscrab/dict.js) */
#def-modal{display:none;position:fixed;inset:0;z-index:500;align-items:flex-end;justify-content:center;}
#def-modal.open{display:flex;}
#def-bd{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
#def-panel{position:relative;z-index:1;background:var(--surface);border:1px solid var(--stroke);
  border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:640px;max-height:80svh;overflow-y:auto;}
#def-panel h2{font-size:18px;font-weight:900;color:var(--txt);}
.def-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
#def-body{font-size:14px;line-height:1.45;color:var(--muted);}
#def-links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.def-ext-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--stroke);
  border-radius:8px;padding:6px 11px;font-size:12px;text-decoration:none;}
.modal-sec{margin-top:12px;font-size:13px;line-height:1.5;}
a.def-link{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>

<header>
  <div id="logo">
    <div class="logo-title">FLASH<span>ODS</span></div>
    <span id="version-badge"></span>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="btn-search" class="hdr-btn" aria-label="Rechercher">🔍</button>
    <button id="btn-home" class="hdr-btn hidden" aria-label="Accueil">⌂</button>
  </div>
</header>

<div id="search-ov">
  <div class="s-top">
    <span class="s-title">🔍 Dictionnaire</span>
    <button id="search-close" class="hdr-btn">Fermer</button>
  </div>
  <div id="search-disp" class="s-disp"></div>
  <div id="search-res" class="s-res"></div>
  <div id="search-kb" class="s-kb">
    <div class="s-row">
      <button class="skk" data-k="A">A</button><button class="skk" data-k="Z">Z</button><button class="skk" data-k="E">E</button><button class="skk" data-k="R">R</button><button class="skk" data-k="T">T</button><button class="skk" data-k="Y">Y</button><button class="skk" data-k="U">U</button><button class="skk" data-k="I">I</button><button class="skk" data-k="O">O</button><button class="skk" data-k="P">P</button>
    </div>
    <div class="s-row">
      <button class="skk" data-k="Q">Q</button><button class="skk" data-k="S">S</button><button class="skk" data-k="D">D</button><button class="skk" data-k="F">F</button><button class="skk" data-k="G">G</button><button class="skk" data-k="H">H</button><button class="skk" data-k="J">J</button><button class="skk" data-k="K">K</button><button class="skk" data-k="L">L</button><button class="skk" data-k="M">M</button>
    </div>
    <div class="s-row">
      <button class="skk wide clr" data-k="CLR">✕</button><button class="skk" data-k="W">W</button><button class="skk" data-k="X">X</button><button class="skk" data-k="C">C</button><button class="skk" data-k="V">V</button><button class="skk" data-k="B">B</button><button class="skk" data-k="N">N</button><button class="skk wide del" data-k="DEL">⌫</button>
    </div>
  </div>
</div>

<main id="view-home"><p style="color:var(--muted);padding:24px;text-align:center;">Chargement…</p></main>
<main id="view-game" class="hidden"></main>

<!-- Fiche définition (réutilisée par blackscrab/dict.js) -->
<div id="def-modal">
  <div id="def-bd"></div>
  <div id="def-panel">
    <div class="def-top">
      <h2 id="def-title"></h2>
      <button id="def-close" class="hdr-btn">Fermer</button>
    </div>
    <p id="def-body"></p>
    <div id="def-links" style="display:none">
      <a id="def-wikt" href="#" target="_blank" rel="noopener" class="def-ext-btn">📖 Wiktionnaire</a>
      <a id="def-img"  href="#" target="_blank" rel="noopener" class="def-ext-btn">🔍 Image</a>
    </div>
    <div id="def-rall" class="modal-sec"></div>
    <div id="def-flechie"></div>
  </div>
</div>

<div id="card-modal">
  <div id="card-bd"></div>
  <div id="card-panel">
    <div class="def-top"><h2 id="card-title">Fiche</h2><button id="card-close" class="hdr-btn">Fermer</button></div>
    <div id="card-modal-body"></div>
  </div>
</div>

<script src="./version.js"></script>
<script>document.getElementById("version-badge").textContent="v"+FLASHODS_VER;</script>
<script src="../data.js"></script>
<script src="../shared/dict-core.js"></script>
<script src="../blackscrab/dict.js"></script>
<script src="./app.js"></script>
<script>
  // Service worker network-first : le PWA installé se met à jour tout seul.
  const CURRENT_CACHE = FLASHODS_CACHE;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
  }
</script>
</body>
</html>
