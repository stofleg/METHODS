<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- fond sombre -->
  <rect width="192" height="192" fill="#111318"/>

  <!-- jeton scrabble (beige, coins arrondis) -->
  <rect x="30" y="20" width="132" height="152" rx="14" fill="#e5dcc8"/>

  <!-- ♠ centré sur le jeton -->
  <text x="96" y="130"
        font-family="'Arial Black','Arial',sans-serif"
        font-size="100" font-weight="900"
        text-anchor="middle"
        fill="#111318">♠</text>

  <!-- valeur scrabble en bas à droite du jeton (le ♠ vaut 3 au Scrabble) -->
  <text x="151" y="164"
        font-family="Arial,sans-serif"
        font-size="20" font-weight="700"
        text-anchor="end"
        fill="#444a6a">3</text>
</svg>
